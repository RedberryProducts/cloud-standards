name: Deploy to Laravel Cloud

# Reusable orchestrator. Callers invoke this from a thin caller workflow.
# Sister-workflow + composite-action references are pinned to `@v1` — the
# RedberryProducts/cloud-standards repo is released atomically, so the moving
# major tag (`v1`) is bumped on every v1.x release.
#
# NOTE: The `v1` tag must exist on RedberryProducts/cloud-standards before
# this orchestrator can be invoked. Until then, callers will fail to resolve.

on:
  workflow_call:
    inputs:
      run-tests:
        type: boolean
        default: true
      enable-deployment-branches:
        description: When false, skip the update-branches step (use for repos that don't deploy via Laravel Cloud).
        type: boolean
        default: true
      dispatched-environment:
        description: Passes through `inputs.environment` from the caller's `workflow_dispatch` (caller-side input).
        type: string
        default: ''
      # ----- tests.yml passthroughs -----
      tests-runner-image:
        type: string
        default: kirschbaumdevelopment/laravel-test-runner:8.4
      tests-database:
        description: "Which database(s) to test against: 'mysql', 'pgsql', or 'both'."
        type: string
        default: 'mysql'
      tests-install-node:
        type: boolean
        default: true
      tests-build-assets:
        type: boolean
        default: true
      tests-command:
        type: string
        default: 'php artisan test'
    secrets:
      REDBERRY_AUTOMATIONS_API_KEY:
        required: false
      REDBERRY_AUTOMATIONS_API_BASE:
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  set-gh-env:
    runs-on: ubuntu-latest
    outputs:
      gh_env: ${{ steps.gh_env.outputs.gh_env }}
    steps:
      - name: Check received secrets
        env:
          HAS_API_KEY: ${{ secrets.REDBERRY_AUTOMATIONS_API_KEY != '' }}
          HAS_API_BASE: ${{ secrets.REDBERRY_AUTOMATIONS_API_BASE != '' }}
        run: |
          echo "API key received: $HAS_API_KEY"
          echo "API base received: $HAS_API_BASE"
      - name: Debug event context
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          echo "Ref name: $GITHUB_REF_NAME"
      - name: Resolve GitHub environment
        id: gh_env
        env:
          # Route all expression values through env vars so attacker-influenceable
          # data (notably ref names) is never interpolated into the shell.
          DISPATCHED_ENV: ${{ inputs.dispatched-environment }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            GH_ENV="$DISPATCHED_ENV"
          elif [ "$REF_NAME" = "main" ]; then
            GH_ENV=development
          elif [[ "$REF_NAME" =~ ^staging-v[0-9]+(\.[0-9]+){2}$ ]]; then
            GH_ENV=staging
          elif [[ "$REF_NAME" =~ ^v[0-9]+(\.[0-9]+){2}$ && "$EVENT_NAME" = "release" ]]; then
            if [ "$EVENT_ACTION" = "prereleased" ]; then
              GH_ENV=prerelease
            elif [ "$EVENT_ACTION" = "released" ]; then
              GH_ENV=production
            fi
          fi

          if [ -z "${GH_ENV:-}" ]; then
            echo "gh_env=None" >> "$GITHUB_OUTPUT"
          else
            echo "gh_env=$GH_ENV" >> "$GITHUB_OUTPUT"
          fi

  set-commit-sha:
    runs-on: ubuntu-latest
    needs: set-gh-env
    outputs:
      commit_sha: ${{ steps.set-sha.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Determine triggering commit SHA
        id: set-sha
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "commit_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            SHA=$(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH")
            echo "commit_sha=$SHA" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            TAG_REF="$GITHUB_REF"
            SHA=$(git rev-list -n 1 "$TAG_REF")
            echo "commit_sha=$SHA" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            SHA=$(git rev-parse "$GITHUB_REF")
            echo "commit_sha=$SHA" >> "$GITHUB_OUTPUT"
          else
            echo "commit_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

  run-tests:
    needs: set-commit-sha
    if: ${{ inputs.run-tests }}
    uses: RedberryProducts/cloud-standards/.github/workflows/tests.yml@v1
    with:
      runner-image: ${{ inputs.tests-runner-image }}
      database: ${{ inputs.tests-database }}
      install-node: ${{ inputs.tests-install-node }}
      build-assets: ${{ inputs.tests-build-assets }}
      test-command: ${{ inputs.tests-command }}

  update-branches:
    needs: [set-commit-sha, set-gh-env, run-tests]
    if: always()
    uses: RedberryProducts/cloud-standards/.github/workflows/update-branches.yml@wip
    with:
      base-commit: ${{ needs.set-commit-sha.outputs.commit_sha }}
      target: ${{ needs.set-gh-env.outputs.gh_env }}
    secrets: inherit
